[project]
name = "acpremote"
dynamic = ["version"]
description = "Generic remote WebSocket transport for ACP agents and clients."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache 2.0" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "agent-client-protocol==0.12.1",
    "typing-extensions>=4.12.0",
    "websockets>=15.0,<16.0",
]

[project.optional-dependencies]
perf = ["uvloop>=0.21.0; platform_system != 'Windows'"]

[project.urls]
Homepage = "https://vcoderun.github.io/acpkit/acpremote/"
Issues = "https://github.com/vcoderun/acpkit/issues"
Repository = "https://github.com/vcoderun/acpkit"

[project.scripts]
acpremote = "acpremote.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/acpremote/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/acpremote"]
