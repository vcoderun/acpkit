name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub release tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build And Publish Workspace
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Verify Published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            | jq --exit-status '.draft == false and .published_at != null' > /dev/null

      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set Up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Validate, Build, And Smoke Test Release
        run: |
          uv sync --frozen --all-extras
          make release RELEASE_TAG="$RELEASE_TAG"

      - name: Upload Validated Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: acpkit-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish Validated Artifacts
        run: uv publish --trusted-publishing always dist/*
